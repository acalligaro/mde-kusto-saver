<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>MDE Kusto Saver</title>
  <style>/*⁣‌‌‌‌‌‌‌​​​‌​​​‌​​‍‌⁣*/
    :root { --accent: #0078d4; --accent2: #5b5fc7; --bg: #f5f6f8; --card: #fff; --text: #1b1a19; --muted: #605e5c; --line: #e8e6e4; }
    * { box-sizing: border-box; }
    body { font: 13px/1.45 "Segoe UI Variable", "Segoe UI", system-ui, sans-serif; margin: 0; width: 520px; color: var(--text); background: var(--bg); }
    body.tab { width: auto; max-width: 820px; margin: 0 auto; }
    header { padding: 14px 18px; color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent2)); }
    header { display: flex; gap: 10px; align-items: center; }
    h1 { font-size: 16px; margin: 0; font-weight: 600; }
    main { padding: 12px 14px 16px; }
    .card { background: var(--card); border-radius: 14px; padding: 12px 14px; margin-bottom: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.06), 0 0 0 1px rgba(0,0,0,.03); }
    h2 { font-size: 11px; letter-spacing: .06em; margin: 0 0 8px; text-transform: uppercase; color: var(--muted); font-weight: 600; }
    input, textarea { width: 100%; padding: 6px 9px; border: 1px solid var(--line); border-radius: 9px; background: #faf9f8; outline: none; font: inherit; margin-bottom: 6px; }
    input:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0,120,212,.15); background: #fff; }
    textarea, pre { font: 12px/1.4 "Cascadia Code", Consolas, monospace; }
    textarea { height: 110px; resize: vertical; }
    button { cursor: pointer; border: 0; border-radius: 9px; padding: 6px 12px; font: inherit; font-weight: 600; background: #eff6fc; color: #005a9e; }
    button:hover { background: #deecf9; }
    button.primary { background: var(--accent); color: #fff; }
    button.primary:hover { background: #106ebe; }
    button.del:hover { background: #fde7e9; color: #a4262c; }
    .actions { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    #msg { color: var(--muted); font-size: 12px; margin-left: auto; }
    #list { list-style: none; margin: 0; padding: 0; max-height: 360px; overflow: auto; }
    body.tab #list { max-height: none; }
    #list li { border-top: 1px solid var(--line); padding: 8px 0; }
    .name { font-weight: 600; cursor: pointer; }
    .tag { display: inline-block; background: #eff6fc; color: #005a9e; border-radius: 6px; padding: 0 6px; margin-left: 4px; font-size: 11px; }
    pre { background: var(--bg); border-radius: 8px; padding: 6px 8px; margin: 6px 0; max-height: 160px; overflow: auto; white-space: pre-wrap; }
    .item .actions button { padding: 3px 9px; font-size: 12px; }
    /* Instant tooltip (the native title waits ~1 s): shown above the button, over the query preview. */
    [data-tip] { position: relative; }
    [data-tip]:hover::after { content: attr(data-tip); position: absolute; bottom: calc(100% + 6px); left: 0; z-index: 1; white-space: nowrap; padding: 4px 8px; border-radius: 6px; background: #323130; color: #fff; font-weight: 400; font-size: 11.5px; pointer-events: none; }
    .empty { color: var(--muted); }
  </style>
</head>
<body>
  <header><img src="icons/icon48.png" width="28" height="28" alt=""><h1>MDE Kusto Saver</h1></header>
  <main>
    <section class="card">
      <h2>Enregistrer</h2>
      <input id="name" placeholder="Nom de la requête">
      <input id="tags" placeholder="Tags séparés par des virgules (optionnel)">
      <textarea id="query" placeholder="Requête KQL (lue depuis l'éditeur de chasse avancée, ou à coller)"></textarea>
      <div class="actions">
        <button id="grab">↻ Lire l'éditeur</button>
        <button id="save" class="primary">Enregistrer</button>
        <button id="clear">Nouveau</button>
        <span id="msg"></span>
      </div>
    </section>
    <section class="card">
      <h2>Bibliothèque (<span id="count">0</span>)</h2>
      <input id="search" placeholder="Rechercher (nom, tag, contenu)">
      <ul id="list"></ul>
      <div class="actions" style="margin-top:8px">
        <button id="export">Exporter JSON</button>
        <button id="import">Importer JSON</button>
        <input id="file" type="file" accept=".json,application/json" hidden>
      </div>
    </section>
  </main>
  <script src="lib.js"></script>
  <script src="popup.js"></script>
</body>
</html>
